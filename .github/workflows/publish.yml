name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Verify branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@fatomate'

      - name: Verify version
        run: |
          package_version=$(node -p 'require("./package.json").version')
          test "$REQUESTED_VERSION" = "$package_version"

      - run: npm ci --no-audit
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand --forceExit

      - name: Pack and verify package
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node -e '
            const [pack] = require(process.env.RUNNER_TEMP + "/pack.json")
            if (pack.name !== "@fatomate/baileys-mongodb-store" || pack.version !== process.env.REQUESTED_VERSION) process.exit(1)
            if (!pack.files.some(({ path }) => path === "dist/index.js")) process.exit(1)
          '
          filename=$(node -p 'require(process.env.RUNNER_TEMP + "/pack.json")[0].filename')
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/$filename" >> "$GITHUB_ENV"

      - name: Verify version is unpublished
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(npm view "@fatomate/baileys-mongodb-store@$REQUESTED_VERSION" version --registry=https://npm.pkg.github.com 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "@fatomate/baileys-mongodb-store@$REQUESTED_VERSION already exists"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -Eq 'E404|404 Not Found'; then
            printf '%s\n' "$output"
            exit "$status"
          fi

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$PACKAGE_TARBALL"
